name: Daily stock screen

on:
  schedule:
    # 12:15 UTC = 6:15 AM Chicago in winter (CST), 7:15 AM in summer (CDT).
    # GitHub can start scheduled runs late, so this leaves room before 8 AM.
    - cron: "15 12 * * 1-5"
    # 15:00 UTC = 9:00 AM Chicago in winter, 10:00 AM in summer: after the open, buy the
    # morning's pretend-portfolio picks at the opening price and live option quotes.
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}
  # Also run when the screen's code changes, so a fix shows up without waiting for the morning.
  # The job's own results commits use the built-in token, which never starts another run.
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements.txt"
      - "tickers_extra.txt"
      - ".github/workflows/daily-screen.yml"

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Annual statements are cached for 7 days so daily runs stay light.
      - uses: actions/cache@v4
        with:
          path: cache
          key: statements-${{ github.run_id }}
          restore-keys: statements-

      - name: Run both screens
        env:
          # Optional. Leave unset and the Reddit columns are skipped.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_SCHEDULE" = "0 15 * * 1-5" ]; then
            python screen.py --fill-only
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python screen.py --workers 2 --paper-buy
          else
            python screen.py --workers 2
          fi

      - name: Commit results
        run: |
          git config user.name "stock-screen bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json docs/summary.json
          if [ -f docs/paper.json ]; then git add docs/paper.json; fi
          if [ -f sp500_fallback.txt ]; then git add sp500_fallback.txt; fi
          git diff --cached --quiet || git commit -m "Screen results $(date -u +%F)"
          git push
